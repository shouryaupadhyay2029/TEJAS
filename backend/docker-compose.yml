services:
  db:
    image: postgres:15
    container_name: tejas_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tejas
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tejas"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: tejas_app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tejas
      ML_API_URL: http://ml_service:8001
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/backend/app
      - ./scripts:/backend/scripts
      - ./data:/backend/data

  # TEJAS ML Urgency Engine Microservice (TEJAS_ml repository container)
  ml_service:
    build:
      context: ../../TEJAS_ml
      dockerfile: Dockerfile
    container_name: tejas_ml_service
    ports:
      - "8001:8001"
    profiles:
      - full  # Run with `docker compose --profile full up` when TEJAS_ml is available

volumes:
  postgres_data:
