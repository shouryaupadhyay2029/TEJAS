services:
  db:
    image: postgres:15
    container_name: tejas_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tejas
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tejas"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: tejas_app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tejas
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/backend/app
      - ./scripts:/backend/scripts
      - ./data:/backend/data

volumes:
  postgres_data:
